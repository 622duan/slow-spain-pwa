  theme: {

        tomato: '#E63946', sand: '#F4A261', olive: '#2A9D8F',

<style>
  html, body { height: 100%; margin: 0; }
  body { font-family: -apple-system, system-ui, sans-serif; background: #F8F9FB; }
  .glass { backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
  .hide-scrollbar::-webkit-scrollbar { display: none; }
  .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  .cat-chip { transition: all 0.2s; }
  .cat-chip-active { background: #1a1a1a !important; color: white !important; }
  .phrase-card { transition: all 0.2s; }
  .play-btn { transition: transform 0.1s; }
  .play-btn:active { transform: scale(0.9); }
  .play-btn.playing { animation: pulse 1s infinite; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }
  .tab-btn { transition: color 0.2s; }
  /* 大字体谐音(便于速读) */
  .pron-huge {
    font-size: 1.5rem; font-weight: 800; color: #6F1D1B;
    letter-spacing: 0.5px; line-height: 1.4;
    word-break: keep-all; overflow-wrap: break-word;
  }
</style>
<script>
  // 强制清理老 SW v2.x 残留,加载最新 data
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs =>
      Promise.all(regs.map(reg => reg.unregister()))
    ).then(() => caches.keys().then(keys =>
      Promise.all(keys.map(k => caches.delete(k)))
    )).then(() => navigator.serviceWorker.register('../sw.js?v=v3.2.0'))
      .then(reg => console.log('[SW v3] registered:', reg.scope))
      .catch(err => console.warn('[SW v3] failed:', err.message));
  }
</script>
</head>

  { id: 'g4', cat: 'chitchat', es: 'No hablo español', zh: '我不会说西语', ipa: '[no a-blo es-pa-ɲol]', tone: '诺 阿布洛 埃斯帕尼奥尔' },
  { id: 'g5', cat: 'chitchat', es: '¿Hablas inglés?', zh: '你会说英语吗?', ipa: '[a-blas in-gles]', tone: '阿布拉斯 英格莱斯' },
  { id: 'g6', cat: 'chitchat', es: '¡Buen provecho!', zh: '祝你好胃口!(饭前)', ipa: '[bwen pro-be-tʃo]', tone: '布温 普罗贝秋' },
  { id: 'g7', cat: 'chitchat', es: 'Salud', zh: '干杯!(碰杯)', ipa: '[sa-lud]', tone: '萨鲁德' },

];

const CAT_LABEL = {
  food: { icon: 'fa-utensils', color: '#E63946', name: '点菜' },
  bargain: { icon: 'fa-hand-holding-dollar', color: '#F4A261', name: '讲价' },
  directions: { icon: 'fa-map-location-dot', color: '#2A9D8F', name: '问路' },
  emergency: { icon: 'fa-circle-exclamation', color: '#264653', name: '紧急' },
  chitchat: { icon: 'fa-handshake', color: '#6F1D1B', name: '寒暄' }
};

let currentCat = 'all';

function render() {
  const container = document.getElementById('phrases-container');
  const filtered = currentCat === 'all' ? PHRASES : PHRASES.filter(p => p.cat === currentCat);

  container.innerHTML = filtered.map(p => {
    const c = CAT_LABEL[p.cat];
    return `
    <div class="phrase-card bg-white rounded-2xl p-4 shadow-sm">
      <div class="flex items-start justify-between gap-2 mb-3">
        <div class="flex-1 min-w-0">
          <span class="inline-block px-2 py-0.5 rounded-md text-[10px] font-semibold mb-1.5" style="background-color:${c.color}22; color:${c.color}">
            <i class="fa-solid ${c.icon} mr-1"></i>${c.name}
          </span>
          <h3 class="es-text text-xl font-bold mb-1.5 leading-tight">${p.es}</h3>
          <p class="text-sm text-midnight/70">${p.zh}</p>
        </div>
        <button class="play-btn w-11 h-11 rounded-full flex items-center justify-center flex-shrink-0" data-text="${p.es}" style="background-color:${c.color}22">
          <i class="fa-solid fa-volume-high text-lg" style="color:${c.color}"></i>
        </button>
      </div>

      <!-- 中文谐音 — 重点!大字! -->
      <div class="rounded-xl p-3 mb-2" style="background: linear-gradient(135deg, ${c.color}11 0%, ${c.color}22 100%);">
        <div class="flex items-center gap-1.5 mb-1">
          <i class="fa-solid fa-comment-dots text-wine text-xs"></i>
          <span class="text-[10px] text-midnight/60 font-semibold uppercase tracking-wide">中文谐音 · 跟着念</span>
        </div>
        <p class="pron-huge">${p.tone}</p>
      </div>

      <div class="flex items-center justify-between">
        <div class="flex items-center gap-1.5">
          <span class="text-[10px] text-midnight/40 font-mono">IPA</span>
          <span class="text-[11px] text-midnight/60 font-mono">${p.ipa}</span>
        </div>
        <button class="copy-btn text-xs text-midnight/40 active:text-tomato" data-text="${p.es}">
          <i class="fa-regular fa-copy"></i>
        </button>
      </div>
    </div>`;
  }).join('');

  // 绑定播放
  container.querySelectorAll('.play-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      playText(btn.dataset.text, btn);
    });
  });
  container.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      try {
        await navigator.clipboard.writeText(btn.dataset.text);
        const orig = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-check text-olive"></i>';
        setTimeout(() => btn.innerHTML = orig, 1200);
      } catch {}
    });
  });
}

function playText(text, btn) {
  if (btn) {
    document.querySelectorAll('.play-btn.playing').forEach(b => {
      if (b !== btn) {
        b.classList.remove('playing');
        b.querySelector('i').classList.remove('fa-pause');
        b.querySelector('i').classList.add('fa-volume-high');
      }
    });
    btn.classList.add('playing');
    btn.querySelector('i').classList.remove('fa-volume-high');
    btn.querySelector('i').classList.add('fa-pause');
  }
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'es-ES';
    u.rate = 0.85;
    u.onend = () => {
      if (btn) {
        btn.classList.remove('playing');
        btn.querySelector('i').classList.remove('fa-pause');
        btn.querySelector('i').classList.add('fa-volume-high');
      }
    };
    window.speechSynthesis.speak(u);
  } else {
    alert(`播放(原型演示):\n\n${text}\n\n真机会调用系统 TTS 朗读`);
    if (btn) {
      btn.classList.remove('playing');
      btn.querySelector('i').classList.remove('fa-pause');
      btn.querySelector('i').classList.add('fa-volume-high');
    }
  }
}

document.querySelectorAll('.cat-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('cat-chip-active'));
    chip.classList.add('cat-chip-active');
    currentCat = chip.dataset.cat;
    render();
  });
});

function goTo(page) { window.location.href = page + '.html'; }
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => goTo(btn.dataset.target));
});

render();
</script>
</body>
</html>
