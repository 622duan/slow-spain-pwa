<script>
  // 强制清理老 SW v2.x 残留,加载最新 data
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs =>
      Promise.all(regs.map(reg => reg.unregister()))
    ).then(() => caches.keys().then(keys =>
      Promise.all(keys.map(k => caches.delete(k)))
    )).then(() => navigator.serviceWorker.register('../sw.js?v=v3.2.0'))
      .then(reg => console.log('[SW v3] registered:', reg.scope))
      .catch(err => console.warn('[SW v3] failed:', err.message));
  }
</script>

<script>
// TabBar
function goTo(page) { window.location.href = page + '.html'; }
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => goTo(btn.dataset.target));
});

// 编辑资料 + 名字持久化
const NAME_KEY = 'slow_spain_traveler_name';
function loadTravelerName() {
  const saved = localStorage.getItem(NAME_KEY);
  const el = document.getElementById('traveler-name');
  if (el) {
    el.textContent = saved && saved.trim() ? saved : '旅行者';
  }
  // Day 也跟着 journey 更新
  const dayEl = document.getElementById('traveler-day');
  if (dayEl && window.SS && window.SS.getCurrentDay) {
    dayEl.textContent = window.SS.getCurrentDay();
  }
}
loadTravelerName();

document.getElementById('edit-profile').addEventListener('click', () => {
  const current = localStorage.getItem(NAME_KEY) || '';
  const name = prompt('修改昵称(留空用默认)', current);
  // 即使清空也保存(保留空)
  if (name !== null) {
    const trimmed = name.trim();
    if (trimmed) {
      localStorage.setItem(NAME_KEY, trimmed);
      document.getElementById('traveler-name').textContent = trimmed;
    } else {
      localStorage.removeItem(NAME_KEY);
      document.getElementById('traveler-name').textContent = '旅行者';
    }
  }
});

// ==================== 顶部统计卡(真实数据) ====================
function updateStats() {
  const bmSet = new Set();
  Object.entries(localStorage).forEach(([k]) => {
    if (k.startsWith('bm_') && localStorage.getItem(k) === '1') bmSet.add(k.slice(3));
  });
  const cityIds = new Set();
  Object.entries(window.SLOW_SPAIN.spots).forEach(([cid, arr]) => {
    if (arr.some(s => bmSet.has(s.id))) cityIds.add(cid);
  });
  // 已打卡 = 收藏中属于"已完成"城市的(我们用 journey 里的 currentCity=barcelona 之外都算已完成)
  const currentCity = window.SLOW_SPAIN.cities.find(c => c.id === 'barcelona');
  const doneCities = window.SLOW_SPAIN.cities.filter(c => c.id !== 'barcelona').map(c => c.id);
  let visited = 0;
  bmSet.forEach(sid => {
    for (const [cid, arr] of Object.entries(window.SLOW_SPAIN.spots)) {
      if (doneCities.includes(cid) && arr.find(s => s.id === sid)) { visited++; break; }
    }
  });

  document.getElementById('num-visited').textContent = visited;
  document.getElementById('num-wishlist').textContent = bmSet.size;
  document.getElementById('num-cities').textContent = cityIds.size;
}
updateStats();

// ==================== 我的发现(用户自建店) ====================
const CUSTOM_SPOTS_KEY = 'custom_spots_v1';
function getCustomSpots() {
  return JSON.parse(localStorage.getItem(CUSTOM_SPOTS_KEY) || '[]');
}
function renderCustomSpots() {
  const list = document.getElementById('custom-spots-list');
  const empty = document.getElementById('custom-spots-empty');
  const spots = getCustomSpots().sort((a, b) => b.createdAt - a.createdAt);
  document.getElementById('custom-count').textContent = spots.length;
  if (spots.length === 0) {
    list.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');
  const cityNames = { madrid: '马德里', toledo: '托莱多', cuenca: '昆卡', valencia: '瓦伦西亚', barcelona: '巴塞罗那' };
  const catIcons = { restaurant: 'fa-utensils', dessert: 'fa-ice-cream', cafe: 'fa-mug-hot', stroll: 'fa-shoe-prints' };
  const catColors = { restaurant: 'tomato', dessert: 'sand', cafe: 'wine', stroll: 'olive' };
  list.innerHTML = spots.map(s => {
    const img = s.image && s.image.startsWith('data:') ? s.image : '/images/placeholder.jpg';
    return `
      <div class="bg-white rounded-2xl overflow-hidden shadow-sm">
        <div class="flex gap-3 p-3">
          <div class="w-20 h-20 rounded-xl bg-gray-100 overflow-hidden flex-shrink-0">
            ${s.image && s.image.startsWith('data:')
              ? `<img src="${s.image}" class="w-full h-full object-cover">`
              : `<div class="w-full h-full flex items-center justify-center text-midnight/30"><i class="fa-solid fa-image text-2xl"></i></div>`}
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-start justify-between gap-2">
              <h4 class="font-semibold text-sm truncate">${s.name}</h4>
              <button class="text-midnight/30 hover:text-tomato active:scale-90 transition-all flex-shrink-0" data-del="${s.id}" title="删除">
                <i class="fa-solid fa-trash-can text-xs"></i>
              </button>
            </div>
            <div class="flex items-center gap-2 mt-1 text-[11px] text-midnight/60">
              <span class="px-1.5 py-0.5 rounded bg-${catColors[s.cat]}/10 text-${catColors[s.cat]}">
                <i class="fa-solid ${catIcons[s.cat]} mr-0.5"></i>${cityNames[s.city] || s.city}
              </span>
              ${s.address ? `<span class="truncate">${s.address}</span>` : ''}
            </div>
            ${s.story && s.story !== '旅行中发现的店' ? `<p class="text-xs text-midnight/70 mt-1.5 line-clamp-2">${s.story}</p>` : ''}
          </div>
        </div>
        ${s.address || s.google_query ? `
          <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.google_query)}" target="_blank" class="block text-center py-2 text-xs text-tomato font-semibold border-t border-gray-100 active:bg-gray-50">
            <i class="fa-solid fa-map-location-dot mr-1"></i>Google Maps 导航
          </a>
        ` : ''}
      </div>
    `;
  }).join('');
  // 绑定删除
  list.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!confirm('删除这家店?')) return;
      const id = btn.dataset.del;
      const arr = getCustomSpots().filter(s => s.id !== id);
      localStorage.setItem(CUSTOM_SPOTS_KEY, JSON.stringify(arr));
      renderCustomSpots();
    });
  });
}
renderCustomSpots();

// 徽章:基于 localStorage 真实数据
document.getElementById('badges-btn').addEventListener('click', () => {
  const bmSet = new Set();
  Object.entries(localStorage).forEach(([k]) => {
    if (k.startsWith('bm_') && localStorage.getItem(k) === '1') bmSet.add(k.slice(3));
  });
  const achieved = [];
  if (bmSet.size >= 1) achieved.push('🥇 第一次收藏');
  if (bmSet.size >= 5) achieved.push('🌟 收藏家 5+');
  if (bmSet.size >= 10) achieved.push('💎 收藏家 10+');
  // 多城市
  const cityCount = new Set();
  Object.entries(window.SLOW_SPAIN.spots).forEach(([cid, arr]) => {
    if (arr.some(s => bmSet.has(s.id))) cityCount.add(cid);
  });
  if (cityCount.size >= 3) achieved.push('🏛️ 三城收藏家');
  if (cityCount.size >= 5) achieved.push('🇪🇸 五城全收');
  // 已打卡
  const visitedCount = parseInt(document.getElementById('num-visited').textContent);
  if (visitedCount >= 1) achieved.push('✅ 第一次打卡');
  if (visitedCount >= 5) achieved.push('🍷 Tapas 行家 5+');
  // 西语
  const mastered = JSON.parse(localStorage.getItem('spanish_mastered') || '[]');
  if (mastered.length >= 5) achieved.push('🗣️ 西语新手');
  if (mastered.length >= 15) achieved.push('🗣️ 西语入门');
  if (mastered.length >= 25) achieved.push('🗣️ 西语流利');

  if (achieved.length === 0) {
    alert('还没有徽章!\n\n收藏你的第一个店铺来获得 🥇 第一次收藏');
  } else {
    alert('已获得 ' + achieved.length + ' 枚徽章:\n\n' + achieved.join('\n'));
  }
});

// 统计:真实数据
document.getElementById('stats-btn').addEventListener('click', () => {
  const bmSet = new Set();
  Object.entries(localStorage).forEach(([k]) => {
    if (k.startsWith('bm_') && localStorage.getItem(k) === '1') bmSet.add(k.slice(3));
  });
  const entries = JSON.parse(localStorage.getItem('slow_spain_journal_v1') || '[]');
  const mastered = JSON.parse(localStorage.getItem('spanish_mastered') || '[]');
  const cityCount = new Set();
  Object.entries(window.SLOW_SPAIN.spots).forEach(([cid, arr]) => {
    if (arr.some(s => bmSet.has(s.id))) cityCount.add(cid);
  });
  alert('旅行统计\n\n'
    + '已收藏: ' + bmSet.size + ' 店\n'
    + '已打卡: ' + document.getElementById('num-visited').textContent + ' 店\n'
    + '足迹城市: ' + cityCount.size + ' 个\n'
    + '旅行日记: ' + entries.length + ' 篇\n'
    + '西语掌握: ' + mastered.length + ' / 29 条');
});

// ==================== 数据备份 / 恢复 ====================
// 导出所有 localStorage 数据为 JSON 文件(旅行中数据很重要,定期备份!)
document.getElementById('backup-btn').addEventListener('click', () => {
  // 弹窗让用户选导出还是导入
  const overlay = document.createElement('div');
  overlay.className = 'fixed inset-0 z-[60] bg-black/60 flex items-end justify-center';
  overlay.innerHTML = `
    <div class="bg-white rounded-t-3xl w-full max-w-lg p-5 pb-8">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-bold">数据备份 / 恢复</h2>
        <button id="bk-close" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>
      <p class="text-xs text-midnight/60 mb-4 leading-relaxed">
        所有打卡、收藏、自定义封面、旅行日记都在你手机的 localStorage 里。
        <span class="text-tomato font-semibold">清浏览器缓存 / 重装手机 / 换设备会丢数据</span>,建议每 1-2 天备份一次。
      </p>

      <div class="space-y-2">
        <button id="bk-export" class="w-full py-3 bg-tomato text-white rounded-2xl font-semibold active:scale-95 transition-all flex items-center justify-center gap-2">
          <i class="fa-solid fa-cloud-arrow-down"></i>
          导出备份(JSON 文件)
        </button>

        <label class="w-full py-3 bg-olive text-white rounded-2xl font-semibold active:scale-95 transition-all flex items-center justify-center gap-2 cursor-pointer">
          <i class="fa-solid fa-cloud-arrow-up"></i>
          从备份文件恢复
          <input type="file" id="bk-import" accept=".json" class="hidden">
        </label>
      </div>

      <div class="mt-4 p-3 bg-amber/5 rounded-xl text-xs text-midnight/70 leading-relaxed">
        <i class="fa-solid fa-circle-info text-amber mr-1"></i>
        <strong>建议操作流程</strong>:导出后,把 JSON 发到自己邮箱/iCloud 收藏;换设备时再下载并恢复。
      </div>

      <div id="bk-data-summary" class="mt-3 text-xs text-midnight/50 text-center"></div>
    </div>
  `;
  document.body.appendChild(overlay);

  // 显示当前数据统计
  const summary = document.getElementById('bk-data-summary');
  const bmCount = Object.keys(localStorage).filter(k => k.startsWith('bm_') && localStorage.getItem(k) === '1').length;
  const visitedCount = Object.keys(localStorage).filter(k => k.startsWith('visited_') && localStorage.getItem(k) === '1').length;
  const journalCount = JSON.parse(localStorage.getItem('slow_spain_journal_v1') || '[]').length;
  const customCount = JSON.parse(localStorage.getItem('custom_spots_v1') || '[]').length;
  const photoCount = Object.values(JSON.parse(localStorage.getItem('spot_photos_v1') || '{}')).reduce((a, b) => a + (Array.isArray(b) ? b.length : 0), 0);
  const expenseCount = JSON.parse(localStorage.getItem('slow_spain_expenses') || '[]').length;
  summary.innerHTML = `当前:<strong>${bmCount}</strong> 收藏 · <strong>${visitedCount}</strong> 打卡 · <strong>${journalCount}</strong> 日记 · <strong>${customCount}</strong> 自建店 · <strong>${photoCount}</strong> 照片 · <strong>${expenseCount}</strong> 记账`;

  // 关闭
  document.getElementById('bk-close').onclick = () => overlay.remove();
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });

  // 导出
  document.getElementById('bk-export').onclick = () => {
    const data = {};
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      try {
        data[key] = JSON.parse(localStorage.getItem(key));
      } catch (e) {
        data[key] = localStorage.getItem(key);
      }
    }
    const blob = new Blob([JSON.stringify({ version: 1, exportedAt: new Date().toISOString(), data }, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `slow-spain-backup-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    alert(`✓ 备份已下载!\n\n文件名:${a.download}\n\n建议把这个文件发到自己邮箱或 iCloud Drive 收藏,不要只放在手机下载文件夹里(换手机会丢)`);
  };

  // 导入
  document.getElementById('bk-import').onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (!confirm('恢复备份会覆盖当前所有数据,确定继续?')) {
      e.target.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const backup = JSON.parse(ev.target.result);
        const data = backup.data || backup;
        let restored = 0;
        for (const [key, val] of Object.entries(data)) {
          localStorage.setItem(key, typeof val === 'string' ? val : JSON.stringify(val));
          restored++;
        }
        alert(`✓ 已恢复 ${restored} 项数据!\n\n建议刷新页面:点底栏"我的"再次进入即可。`);
        overlay.remove();
        // 刷新当前页数据
        if (typeof updateStats === 'function') updateStats();
        if (typeof renderCustomSpots === 'function') renderCustomSpots();
        if (typeof loadTravelerName === 'function') loadTravelerName();
      } catch (err) {
        alert('❌ 恢复失败:文件格式不对\n\n' + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  };
});
</script>
